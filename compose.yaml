services:
  allegro:
    # Pull the published image with `docker compose pull`, or build the local
    # source with `docker compose build`. Compose does the right thing by default.
    image: ghcr.io/majorlupa/alluploadgro:latest
    build: .
    environment:
      ALLEGRO_CLIENT_ID: ${ALLEGRO_CLIENT_ID:-}
      ALLEGRO_CLIENT_SECRET: ${ALLEGRO_CLIENT_SECRET:-}
    volumes:
      - allegro-data:/data
      - ./examples:/offers:ro
volumes:
  allegro-data:
